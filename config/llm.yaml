# LLM routing: which model answers each stage, in priority order.
#
# Current priority: OpenAI first (free credits), Gemini as the fallback.
# To flip it later without touching this file, set in .env:
#     POCKET_LLM_PROVIDER_ORDER=gemini,openai
# (every chain is re-sorted by provider; order within a provider is kept).
#
# Models without credentials in the environment are skipped automatically.
# If every model in a chain fails, the message is kept and retried later
# (see docs/02-message-lifecycle.md), nothing is lost.

router:
  fast:          # Stage A intent classifier: cheap, fast
    primary: openai/gpt-4o-mini
    fallbacks: [gemini/gemini-flash-lite-latest]
  extractor:     # Stage B/C: structured extraction + categorization
    primary: openai/gpt-4o-mini
    fallbacks: [gemini/gemini-flash-lite-latest, gemini/gemini-3.8-flash]
  resolver:      # edit / delete target resolution
    primary: openai/gpt-4o-mini
    fallbacks: [gemini/gemini-flash-lite-latest]
  query:         # NL question -> query plan
    primary: openai/gpt-4o-mini
    fallbacks: [gemini/gemini-3.8-flash, gemini/gemini-flash-lite-latest]
  summarizer:    # weekly/monthly digest wording
    primary: openai/gpt-4o-mini
    fallbacks: [gemini/gemini-flash-lite-latest]
  vision:        # photos, screenshots, scanned statement pages
    primary: openai/gpt-4o-mini
    fallbacks: [gemini/gemini-3.8-flash]

# stage -> chain
purposes:
  intent: fast
  extract: extractor
  categorize: extractor
  edit: resolver
  delete: resolver
  query: query
  summarize: summarizer
  document: extractor        # statement pages with a text layer
  document_image: vision     # scanned pages, screenshots, photos

# free-tier limits; we skip a model once it's within 5% of these
quotas:
  gemini/gemini-3.8-flash: {rpm: 10, rpd: 250}
  gemini/gemini-flash-lite-latest: {rpm: 15, rpd: 1000}

transcription:
  model: openai/gpt-4o-mini-transcribe
  fallbacks: [openai/whisper-1]

fallback_triggers:  # documentation only, these are hardcoded in llm/router.py
  - rate_limit
  - context_length
  - server_error
  - timeout
  - schema_parse_fail
