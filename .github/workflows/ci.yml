name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra postgres
      - name: lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: typecheck
        run: uv run mypy src
      - name: tests
        run: uv run pytest -q
      - name: migrations apply cleanly
        run: POCKET_DATABASE_URL=sqlite:///ci.db uv run pocket migrate

  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pocket:latest
            ghcr.io/${{ github.repository_owner }}/pocket:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # set DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY secrets to enable
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/pocket/app
            git pull --ff-only
            docker compose pull
            docker compose up -d
            docker image prune -f
